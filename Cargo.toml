[package]
name = "foxmayn_cowork_cli"
version = "1.0.0"
edition = "2024"
# MSRV: highest dependency rust-version in the lockfile is 1.89 (rusqlite 0.41, uuid 1.29);
# the code also needs let-chains (1.88). Checked in CI by the `msrv` job.
rust-version = "1.89"
license = "MIT"
description = "Terminal UI for AI-assisted file management"
repository = "https://github.com/nasroykh/foxmayn_cowork_cli"
homepage = "https://github.com/nasroykh/foxmayn_cowork_cli"
readme = "README.md"
keywords = ["tui", "llm", "ai", "file-manager", "cli"]
categories = ["command-line-utilities"]
publish = false
exclude = [".agents/", ".github/", "docs/"]

[[bin]]
name = "foxmayn-cowork"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
tui-markdown = "0.3.12"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ratatui-textarea = "0.9"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
regex = "1"
pdf-extract = "0.12"
rusqlite = { version = "0.41", features = ["bundled"] }
dirs = "7"
rpassword = "7"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Optional: local LLM inference via llama.cpp
llama-cpp-2 = { version = "0.1", optional = true, features = ["sampler"] }
hf-hub    = { version = "1.0", features = ["rustls-tls"], optional = true }

[features]
# CPU-only local inference (cross-compiles cleanly)
local       = ["dep:llama-cpp-2", "dep:hf-hub"]
# GPU acceleration variants (add on top of `local`)
local-metal = ["local", "llama-cpp-2/metal"]
local-cuda  = ["local", "llama-cpp-2/cuda"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# panic stays "unwind": the TUI panic hook must restore the terminal.
